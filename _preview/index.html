<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Cheng Liu — Website in preparation</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17365d;
        background: #f7f9fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 15% 20%, rgba(77, 125, 184, 0.14), transparent 34rem),
          radial-gradient(circle at 85% 80%, rgba(179, 74, 96, 0.10), transparent 30rem),
          #f7f9fc;
      }

      main {
        width: min(40rem, 100%);
        padding: clamp(2rem, 7vw, 4.5rem);
        text-align: center;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(23, 54, 93, 0.1);
        border-radius: 1.5rem;
        box-shadow: 0 1.5rem 4rem rgba(23, 54, 93, 0.09);
      }

      .mark {
        width: 3rem;
        height: 0.22rem;
        margin: 0 auto 2rem;
        border-radius: 999px;
        background: #b34a60;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.2rem, 8vw, 4.2rem);
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .cn {
        margin: 1rem 0 0;
        color: #b34a60;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .message {
        margin: 2rem auto 0;
        max-width: 29rem;
        color: #53657b;
        font-size: 1.05rem;
        line-height: 1.8;
      }

      small {
        display: block;
        margin-top: 2.5rem;
        color: #8996a6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Cheng Liu</h1>
      <p class="cn">网站正在整理中</p>
      <p class="message">
        This personal website is currently being revised.<br>
        Please check back later.
      </p>
      <small>Preview mode</small>
    </main>
  </body>
</html>
