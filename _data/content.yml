profile:
  name: "Cheng Liu"
  name_zh: "刘铖"
  role: "M.Phil. student in Robotics and Autonomous Systems at HKUST(GZ)"
  tagline: "Humanoid robotics, reinforcement learning, whole-body control, and embodied intelligence."
  location: "Guangzhou, China"
  email: "cliu425@connect.hkust-gz.edu.cn"
