about:
  - "I am an M.Phil. student in Robotics and Autonomous Systems at the Hong Kong University of Science and Technology (Guangzhou). My research focuses on humanoid locomotion, whole-body control, reinforcement learning, and embodied intelligence."
  - "I work across algorithms and robot systems, with a particular interest in turning policies that succeed in simulation into physical skills that remain reliable in the real world."

interests:
  - Humanoid Robotics
  - Reinforcement Learning
  - Whole-Body Control
  - Sim-to-Real
  - Embodied Intelligence

