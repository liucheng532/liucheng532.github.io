research:
  - title: "PingPongDuo: Agile Humanoid Table Tennis Doubles with Safe Team Coordination"
    year: "2026"
    media: "media/RESEARCH/pingpongduo.gif"
    alt: "Two humanoid robots playing table tennis doubles in the PingPongDuo project"
    description: "Agile humanoid table tennis doubles with safe team coordination. Contributed to the RL planner's sim-to-real integration and deployment on humanoid robots. Submitted to ICRA 2027."
    tags: ["Humanoid", "Table Tennis", "Sim-to-Real", "ICRA 2027 · Submitted"]
    links: []
  - title: "Learning Robust Humanoid Motion Control for Robot Soccer"
    year: "2026"
    media: "media/RESEARCH/recovery-locomotion-real-1.gif"
    alt: "Real humanoid robot recovering from a fall and returning to locomotion"
    main_media:
      - media: "media/RESEARCH/recovery-locomotion-real-2.gif"
        alt: "Second real-robot demonstration of unified recovery and locomotion"
    description: "A unified recovery-locomotion framework designed to recover from diverse falls, resume walking, and remain robust under physical variation."
    tags: ["Humanoid", "Reinforcement Learning", "Sim-to-Real"]
    links:
      - label: "RoboCup demo"
        url: "media/PROJECTS/Robocup/2026robocup.mp4"
