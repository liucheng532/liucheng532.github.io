  - title: "Self-Play Dribbling for Humanoid Robot Soccer"
    year: "2026"
    media: "media/RESEARCH/selfplay-dribble.gif"
    alt: "Self-play humanoid robot dribbling in simulation"
    main_media:
      - media: "media/RESEARCH/dribble-real-robot.gif"
        alt: "Real humanoid robot demonstrating the learned dribbling policy"
    description: "A self-play learning framework for agile dribbling policies in competitive multi-agent environments."
    tags: ["Self-Play", "Robot Soccer", "Deep RL"]
    links:
      - label: "Video"
