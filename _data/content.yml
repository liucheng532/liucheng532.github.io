about:
  - "I am a Research Assistant at [OpenDriveLab](https://opendrivelab.com/), The University of Hong Kong, supervised by [Prof. Hongyang Li](https://scholar.google.com/citations?user=Hfrih1EAAAAJ&hl=en)."
  - "I earned my M.Phil. in Robotics and Autonomous Systems from the Hong Kong University of Science and Technology (Guangzhou), where I worked in [RIL-Lab](https://ril-lab.top/en/) under the supervision of [Prof. Qiang Nie](https://scholar.google.com/citations?user=q-Qqa20AAAAJ&hl=en) and was co-supervised by [Prof. Renjing Xu](https://scholar.google.com/citations?user=Mu__bJEAAAAJ&hl=en)."
  - "My research interests focus on humanoid motion control, whole-body control, and loco-manipulation. I have recently been exploring agentic robotics."

opportunities: "I am actively seeking **internship opportunities** and **Fall 2027 PhD positions**."

interests:
  - Humanoid Motion Control
  - Whole-Body Control
  - Loco-Manipulation
  - Agentic Robotics

